name: "Continuous integration"

on:
  push:
    branches:
      - "main"
      - "develop"
      - "support/*"
    tags:
       - "*"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  generate-ci-matrix:
    name: "Generate CI matrix"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@v1"
    with:
      glpi-version: "12.0.x"
  ci:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: "generate-ci-matrix"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix.outputs.matrix) }}
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1"
    with:
      plugin-key: "carbon"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"
      skip-changelog-check: true
  verify-build-assets:
    name: "Verify frontend build assets"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-node@v7"
        with:
          node-version-file: "package.json"
      - name: "Install dependencies (triggers webpack build)"
        run: "npm install"
      - name: "Check generated assets are present"
        run: |
          for file in public/lib/apexcharts.js public/lib/carbon.js public/lib/carbon.css; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty build asset: $file"
              exit 1
            fi
          done
